<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>mAP 채점 (시나리오1)</title>
<!--
  공인시험 시나리오1(객체 인식 정확도) 채점 화면. 심사 자리에서 띄운다.

  요구사항(2026-09-01)
    - 모델의 박스를 미리 넣지 않고, 채점 시작 시 그 자리에서 다시 예측한다
    - 사람이 만든 GT 와 비교하는 과정을 순서대로 볼 수 있어야 한다
    - 부품별 탭으로 결과를 견줄 수 있어야 한다
    - 수치가 어떻게 계산돼 그 결과가 나왔는지 근거가 화면에 있어야 한다

  그래서 화면을 다섯 단계로 나눠 각 단계의 실제 숫자를 보여 준다.
    ① GT 확인 → ② 재예측 → ③ 매칭(IoU 0.5) → ④ AP 적분 → ⑤ 판정
  ④ 는 AP 를 만든 누적 계열을 표로 그대로 보여 준다(표의 TP/FP/FN 세 숫자로는
  AP 를 역산할 수 없다). 프레임 그림에는 GT 와 검출을 겹쳐 그려 FP 이유를 눈으로 본다.
-->
<style>
  :root{
    --bg:#f1f5f9; --surface:#fff; --surface-2:#f8fafc; --surface-3:#f1f5f9;
    --line:#e2e8f0; --line-strong:#cbd5e1;
    --ink-strong:#0f172a; --ink:#1e293b; --muted:#64748b; --faint:#94a3b8;
    --accent:#4f46e5; --accent-ink:#4338ca; --accent-bg:#eef2ff; --accent-line:#c7d2fe;
    --success:#16a34a; --success-ink:#15803d; --success-line:#86efac; --success-bg:#dcfce7;
    --warn:#b45309; --warn-line:#fde68a; --warn-bg:#fffbeb;
    --danger:#dc2626; --danger-ink:#b91c1c; --danger-line:#fecaca; --danger-bg:#fee2e2;
    --r-sm:6px; --r-md:10px; --r-lg:14px;
    --font:'Noto Sans KR','Malgun Gothic',system-ui,-apple-system,sans-serif;
    --mono:'Consolas','D2Coding',ui-monospace,monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.55;
       display:flex;flex-direction:column}
  button{font:inherit;color:inherit;cursor:pointer}
  [hidden]{display:none !important}
  h1{margin:0;font-size:17px;color:var(--ink-strong);white-space:nowrap}
  h2{margin:0 0 8px;font-size:14px;color:var(--ink-strong)}

  header{flex:none;background:var(--surface);border-bottom:1px solid var(--line);
         padding:10px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  .spacer{flex:1}
  .btn{min-height:38px;padding:0 16px;border-radius:var(--r-md);border:1px solid var(--line-strong);
       background:var(--surface);font-weight:700}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  .btn.primary:hover:not(:disabled){background:var(--accent-ink)}
  .btn:disabled{opacity:.45;cursor:not-allowed}
  .btn.ghost{background:transparent}
  select{min-height:38px;padding:0 10px;border-radius:var(--r-md);border:1px solid var(--line-strong);
         background:var(--surface);font:inherit;font-weight:600}

  .score{display:flex;align-items:baseline;gap:8px;padding:4px 14px;border-radius:var(--r-md);
         border:1px solid var(--line);background:var(--surface-3)}
  .score b{font-size:26px;line-height:1;color:var(--ink-strong);font-variant-numeric:tabular-nums}
  .score.pass{background:var(--success-bg);border-color:var(--success-line)}
  .score.pass b{color:var(--success-ink)}
  .score.fail{background:var(--danger-bg);border-color:var(--danger-line)}
  .score.fail b{color:var(--danger-ink)}
  .verdict{font-weight:800}


  /* --- 접근성·상호작용 공통 (UI 검수 반영) --- */
  /* 키보드 사용자에게 보이는 포커스 표시. 마우스 클릭에는 나타나지 않는다(:focus-visible) */
  :where(button, select, a, [tabindex]):focus-visible{
    outline:3px solid var(--accent); outline-offset:2px; border-radius:var(--r-sm)}
  .btn, .tabs button, .card, .fr{transition:background-color .15s ease, border-color .15s ease,
    box-shadow .15s ease, color .15s ease}
  /* 모션을 줄이도록 설정한 사용자에게는 전환·부드러운 스크롤을 끈다 */
  @media (prefers-reduced-motion: reduce){
    *{transition:none !important; animation:none !important; scroll-behavior:auto !important}
  }
  main{flex:1;min-height:0;overflow:auto;padding:14px 16px 28px}
  .msg{margin:0 0 12px;padding:11px 14px;border-radius:var(--r-md);background:var(--warn-bg);
       border:1px solid var(--warn-line);color:var(--warn);font-weight:600}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);
        padding:12px 14px;margin-bottom:14px}

  /* 단계 */
  .steps{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:14px}
  .step{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:10px 12px}
  .step.on{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-bg)}
  .step.done{border-color:var(--success-line);background:var(--success-bg)}
  .step .no{font-size:11px;font-weight:800;color:var(--muted)}
  .step .ti{font-weight:700;color:var(--ink-strong);margin:2px 0 4px}
  .step .va{font-family:var(--mono);font-size:12px;color:var(--ink);white-space:pre-line}
  .step .fo{font-size:11px;color:var(--muted);margin-top:4px}
  @media (max-width:1100px){.steps{grid-template-columns:repeat(2,1fr)}}

  table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
  th,td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:right;white-space:nowrap}
  th:first-child,td:first-child{text-align:left}
  thead th{background:var(--surface-2);color:var(--muted);font-size:12px;font-weight:700}
  tbody tr:hover{background:var(--surface-2)}
  #tblParts tbody tr, #tblSeries tbody tr{cursor:pointer}
  thead th[data-sort]{cursor:pointer;user-select:none}
  thead th[data-sort]:hover{color:var(--ink-strong)}
  thead th[aria-sort]::after{content:"\25be";margin-left:4px;color:var(--accent)}
  thead th[aria-sort="ascending"]::after{content:"\25b4"}
  tr.sel{background:var(--accent-bg)}
  .num{font-family:var(--mono)}
  .ok{color:var(--success-ink);font-weight:700}
  .no{color:var(--danger-ink);font-weight:700}
  .scroll{overflow:auto;max-height:340px;border:1px solid var(--line);border-radius:var(--r-md)}

  .tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
  .tabs button{min-height:34px;padding:0 12px;border-radius:999px;border:1px solid var(--line-strong);
               background:var(--surface);font-weight:700;color:var(--muted)}
  .tabs button.on{background:var(--accent);border-color:var(--accent);color:#fff}
  .tabs button .ap{font-family:var(--mono);font-weight:800;margin-left:6px}

  .grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px}
  @media (max-width:1000px){.grid2{grid-template-columns:1fr}}
  .kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:13px}
  .kv div:nth-child(odd){color:var(--muted)}
  .kv div:nth-child(even){font-family:var(--mono);color:var(--ink-strong);font-weight:700}
  .calc{font-family:var(--mono);font-size:12px;background:var(--surface-2);border:1px solid var(--line);
        border-radius:var(--r-md);padding:10px 12px;white-space:pre-wrap;color:var(--ink)}
  .frames{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:10px}
  .fr{border:1px solid var(--line);border-radius:var(--r-md);overflow:hidden;background:#0f172a}
  .fr img{width:100%;display:block}
  .fr{cursor:zoom-in}
  .fr.big{grid-column:1/-1;cursor:zoom-out}
  .fr .cap{background:var(--surface);padding:5px 8px;font-size:11px;color:var(--muted);
           display:flex;justify-content:space-between;gap:6px}
  .legend{display:flex;gap:14px;font-size:12px;color:var(--muted);margin:2px 0 10px}
  .legend i{display:inline-block;width:11px;height:11px;border-radius:2px;margin-right:5px}
</style>
</head>
<body>
<header>
  <h1>mAP 채점</h1>
  <button class="btn primary" id="btnRun">채점 시작</button>
  <select id="runSel" title="지난 채점" aria-label="지난 채점 기록"></select>
  <span class="score" id="score"><span>mAP@0.5</span><b>-</b><span class="verdict"></span></span>
  <span class="spacer"></span>
  <span class="num" id="modelLabel" style="font-size:12px;color:var(--muted)"></span>
</header>

<main>
  <div class="msg" id="msg" role="status" aria-live="polite" hidden></div>

  <div class="steps" id="steps"></div>

  <div class="card">
    <h2>부품별 결과</h2>
    <div class="scroll" style="max-height:none">
      <table id="tblParts">
        <thead><tr>
          <th data-sort="part">부품</th><th data-sort="n_images">GT 프레임</th>
          <th data-sort="n_gt">GT 박스</th><th data-sort="det">검출</th>
          <th data-sort="tp">TP</th><th data-sort="fp">FP</th><th data-sort="fn">FN</th>
          <th data-sort="precision">정밀도</th><th data-sort="recall">재현율</th>
          <th data-sort="ap" aria-sort="descending">AP@0.5</th>
        </tr></thead>
        <tbody></tbody>
        <tfoot></tfoot>
      </table>
    </div>
    <div class="legend" style="margin-top:8px">
      TP·FP·FN·정밀도·재현율 = <b id="rcTxt">conf 0.70</b> 한 지점 · AP = conf 0.001 이상 전 구간 적분
    </div>
  </div>

  <div class="tabs" id="tabs"></div>

  <div id="detail" hidden>
    <div class="grid2">
      <div class="card">
        <h2>수치</h2>
        <div class="kv" id="partKv"></div>
        <div class="calc" id="partCalc" style="margin-top:10px"></div>
      </div>
      <div class="card">
        <h2>PR 곡선 · AP = 곡선 아래 면적</h2>
        <div id="prBox"></div>
        <div class="legend"><span>가로 재현율 · 세로 정밀도</span></div>
      </div>
    </div>

    <div class="card">
      <h2>프레임 <span class="num" id="frTitle" style="color:var(--muted);font-weight:400"></span></h2>
      <div class="legend">
        <span><i style="background:#00c800"></i>GT (실선)</span>
        <span><i style="background:#008cff"></i>TP (점선)</span>
        <span><i style="background:#ff3c00"></i>FP (점선)</span>
        <span>숫자 = conf · IoU</span>
      </div>
      <div class="frames" id="frames"></div>
    </div>
    <div class="card">
      <h2>누적 계열 <span class="num" id="serTitle" style="color:var(--muted);font-weight:400"></span></h2>
      <div class="legend">한 줄 = 검출 1건 · conf 내림차순 누적 · AP = Σ(재현율 증가분 × 정밀도)</div>
      <div class="scroll"><table id="tblSeries"><thead></thead><tbody></tbody></table></div>
    </div>

  </div>
</main>

<script>
"use strict";
const $ = (id) => document.getElementById(id);
const api = async (u, o) => {
  const r = await fetch(u, o);
  return r.json().catch(() => ({ error: "응답을 읽지 못했습니다(HTTP " + r.status + ")" }));
};
const post = (u, b) => api(u, { method: "POST", headers: { "Content-Type": "application/json" },
                                body: JSON.stringify(b) });
function say(t) {
  const m = $("msg");
  if (!t) { m.hidden = true; return; }
  m.hidden = false; m.textContent = t;
}
const f2 = (v) => (v == null ? "-" : Number(v).toFixed(2));
const f3 = (v) => (v == null ? "-" : Number(v).toFixed(3));
const pct = (v) => (v == null ? "-" : (Number(v) * 100).toFixed(1) + "%");

const S = { sortKey: "ap", sortAsc: false, res: null, part: null, series: null, det: null, job: null };

/* ---------------- 단계 카드 ---------------- */
function steps(res, prog) {
  const cls = res ? res.classes || [] : [];
  const nImg = cls.reduce((a, c) => a + (c.n_images || 0), 0);
  const nGt = cls.reduce((a, c) => a + (c.n_gt || 0), 0);
  const nDet = cls.reduce((a, c) => a + (c.tp || 0) + (c.fp || 0), 0);
  const tp = cls.reduce((a, c) => a + (c.tp || 0), 0);
  const fp = cls.reduce((a, c) => a + (c.fp || 0), 0);
  const fn = cls.reduce((a, c) => a + (c.fn || 0), 0);
  const items = [
    ["①", "GT", res ? nImg + "장 · 박스 " + nGt + "개" : (prog || "-"),
     "라벨 없는 프레임 제외"],
    ["②", "재예측", res ? "부품 " + cls.length + "종 · conf 0.001" : (prog || "-"),
     "매번 새로 추론"],
    ["③", "IoU " + (res ? res.iou : "0.5"),
     res ? "TP " + tp + " · FP " + fp + " · FN " + fn : "-",
     "conf 높은 검출부터 · GT 하나는 한 번만"],
    ["④", "AP", res ? cls.map((c) => c.part.slice(0, 8) + " " + f3(c.ap)).join("\n") : "-",
     "all-point interpolation (COCO)"],
    ["⑤", "판정", res ? res.map50_pct + " / " + res.pass_threshold +
                       (res.verdict === "pass" ? " 합격" : " 불합격") : "-",
     "mAP = AP 산술평균"]
  ];
  $("steps").innerHTML = items.map((it, i) => {
    const on = res ? "done" : (prog && i < 2 ? "on" : "");
    return '<div class="step ' + on + '"><div class="no">' + it[0] + "</div><div class=\"ti\">" +
           it[1] + '</div><div class="va">' + it[2] + '</div><div class="fo">' + it[3] +
           "</div></div>";
  }).join("");
}

/* ---------------- 결과 표·탭 ---------------- */
function renderResult(res) {
  S.res = res;
  const sc = $("score");
  sc.className = "score " + (res.verdict === "pass" ? "pass" : "fail");
  sc.innerHTML = "<span>mAP@0.5</span><b>" + res.map50_pct + "</b>" +
                 '<span class="verdict">' + (res.verdict === "pass" ? "합격" : "불합격") +
                 " (기준 " + res.pass_threshold + ")</span>";
  $("modelLabel").textContent = res.model_label || "";
  $("rcTxt").textContent = "conf " + f2(res.report_conf);
  steps(res);

  const tb = $("tblParts").querySelector("tbody");
  tb.innerHTML = (res.classes || []).map((c) =>
    '<tr data-part="' + c.part + '"><td>' + c.part + (c.in_model ? "" : " (모델에 없음)") +
    '</td><td class="num">' + c.n_images + '</td><td class="num">' + c.n_gt +
    '</td><td class="num">' + (c.tp + c.fp) + '</td><td class="num ok">' + c.tp +
    '</td><td class="num no">' + c.fp + '</td><td class="num no">' + c.fn +
    '</td><td class="num">' + pct(c.precision) + '</td><td class="num">' + pct(c.recall) +
    '</td><td class="num"><b>' + f3(c.ap) + "</b></td></tr>").join("");
  const n = (res.classes || []).length || 1;
  const sum = (k) => (res.classes || []).reduce((a, c) => a + (c[k] || 0), 0);
  $("tblParts").querySelector("tfoot").innerHTML =
    '<tr><td><b>합계 · mAP</b></td><td class="num">' + sum("n_images") +
    '</td><td class="num">' + sum("n_gt") + '</td><td class="num">' + (sum("tp") + sum("fp")) +
    '</td><td class="num">' + sum("tp") + '</td><td class="num">' + sum("fp") +
    '</td><td class="num">' + sum("fn") + '</td><td></td><td></td><td class="num"><b>' +
    f3(res.map50) + "</b></td></tr>";
  tb.querySelectorAll("tr").forEach((tr) => {
    tr.onclick = () => pick(tr.dataset.part);
  });

  $("tabs").innerHTML = (res.classes || []).map((c) =>
    '<button data-part="' + c.part + '">' + c.part +
    '<span class="ap">' + f3(c.ap) + "</span></button>").join("");
  $("tabs").querySelectorAll("button").forEach((b) => {
    b.onclick = () => pick(b.dataset.part);
    b.setAttribute("aria-pressed", b.dataset.part === S.part ? "true" : "false");
  });
  // 부품 표 정렬. 어느 부품이 점수를 끌어내리는지 바로 보려면 정렬이 필요하다.
  $("tblParts").querySelectorAll("thead th[data-sort]").forEach((th) => {
    th.onclick = () => sortBy(th.dataset.sort);
  });
  $("tblParts").querySelectorAll("thead th[data-sort]").forEach((th) => {
    if (th.dataset.sort === S.sortKey) {
      th.setAttribute("aria-sort", S.sortAsc ? "ascending" : "descending");
    } else { th.removeAttribute("aria-sort"); }
  });
  const runs = res.runs || [];
  $("runSel").innerHTML = runs.map((r) =>
    '<option value="' + r + '"' + (r === res.run ? " selected" : "") + ">" + r + "</option>").join("");
  if ((res.classes || []).length) { pick(res.part || res.classes[0].part); }
}

function sortBy(key) {
  const asc = S.sortKey === key ? !S.sortAsc : (key === "part");
  S.sortKey = key; S.sortAsc = asc;
  const val = (c) => (key === "det" ? (c.tp || 0) + (c.fp || 0) : c[key]);
  (S.res.classes || []).sort((a, b) => {
    const x = val(a), y = val(b);
    if (typeof x === "string") { return asc ? x.localeCompare(y) : y.localeCompare(x); }
    return asc ? x - y : y - x;
  });
  renderResult(Object.assign({}, S.res, { part: S.part }));
}

/* ---------------- 부품 상세 ---------------- */
async function pick(part) {
  if (!part) { return; }
  S.part = part;
  $("detail").hidden = false;
  $("tabs").querySelectorAll("button").forEach((b) => {
    b.className = b.dataset.part === part ? "on" : "";
  });
  $("tblParts").querySelectorAll("tbody tr").forEach((tr) => {
    tr.className = tr.dataset.part === part ? "sel" : "";
  });
  const c = (S.res.classes || []).find((x) => x.part === part) || {};

  $("partKv").innerHTML = [
    ["GT 프레임 / 박스", c.n_images + "장 / " + c.n_gt + "개"],
    ["검출 (conf " + f2(S.res.report_conf) + ")", (c.tp + c.fp) + "건"],
    ["TP / FP / FN", c.tp + " / " + c.fp + " / " + c.fn],
    ["정밀도 = TP/(TP+FP)", pct(c.precision)],
    ["재현율 = TP/(TP+FN)", pct(c.recall)],
    ["F1", f3(c.f1)],
    ["AP@0.5 (전 구간)", f3(c.ap)],
    ["모델 포함", c.in_model ? "예" : "아니오 (검출 0 → 전부 FN)"]
  ].map((r) => "<div>" + r[0] + "</div><div>" + r[1] + "</div>").join("");

  $("partCalc").textContent =
    "정밀도 = " + c.tp + " / (" + c.tp + " + " + c.fp + ") = " + f3(c.precision) + "\n" +
    "재현율 = " + c.tp + " / (" + c.tp + " + " + c.fn + ") = " + f3(c.recall) + "\n" +
    "AP = Σ (ΔR × P) = " + f3(c.ap) + "\n" +
    "mAP = " + (S.res.classes || []).length + "종 평균 = " + f3(S.res.map50);

  drawPR(c);
  await loadSeries(part);
  await loadFrames(part);
}

function drawPR(c) {
  const rec = (c.pr && c.pr.recall) || [], pre = (c.pr && c.pr.precision) || [];
  const W = 460, H = 300, m = 34;
  const x = (v) => m + v * (W - m - 10);
  const y = (v) => H - m - v * (H - m - 12);
  let path = "";
  rec.forEach((r, i) => { path += (i ? " L" : "M") + x(r) + "," + y(pre[i]); });
  let grid = "";
  for (let g = 0; g <= 1.0001; g += 0.25) {
    grid += '<line x1="' + x(g) + '" y1="' + y(0) + '" x2="' + x(g) + '" y2="' + y(1) +
            '" stroke="#e2e8f0"/><line x1="' + x(0) + '" y1="' + y(g) + '" x2="' + x(1) +
            '" y2="' + y(g) + '" stroke="#e2e8f0"/>' +
            '<text x="' + x(g) + '" y="' + (H - 12) + '" font-size="10" fill="#94a3b8" text-anchor="middle">' +
            g.toFixed(2) + '</text><text x="' + (m - 6) + '" y="' + (y(g) + 3) +
            '" font-size="10" fill="#94a3b8" text-anchor="end">' + g.toFixed(2) + "</text>";
  }
  $("prBox").innerHTML =
    '<svg role="img" aria-label="' + (c.part || "") + " PR 곡선. AP " + f3(c.ap) +
    ". 같은 내용이 아래 누적 계열 표에 숫자로 있습니다." + '" viewBox="0 0 ' + W + " " + H +
    '" style="width:100%;height:auto;max-height:320px">' + grid +
    (path ? '<path d="' + path + '" fill="rgba(79,70,229,.12)" stroke="#4f46e5" stroke-width="2"/>' : "") +
    rec.map((r, i) => '<circle cx="' + x(r) + '" cy="' + y(pre[i]) + '" r="2.5" fill="#4f46e5"/>').join("") +
    '<text x="' + (W - 10) + '" y="' + (m - 14) + '" font-size="12" fill="#0f172a" text-anchor="end" font-weight="700">AP ' +
    f3(c.ap) + "</text></svg>";
}

async function loadSeries(part) {
  const d = await api("/api/gt/eval/series?run=" + encodeURIComponent(S.res.run) +
                      "&part=" + encodeURIComponent(part) + "&limit=400");
  const th = $("tblSeries").querySelector("thead");
  const tb = $("tblSeries").querySelector("tbody");
  if (d.error) { th.innerHTML = ""; tb.innerHTML = '<tr><td>' + d.error + "</td></tr>"; return; }
  S.series = d;
  const label = { i: "순번", conf: "conf", match: "판정", image: "프레임",
                  cum_tp: "누적 TP", cum_fp: "누적 FP", precision: "정밀도",
                  recall: "재현율", at_report: "임계 안" };
  th.innerHTML = "<tr>" + d.head.map((h) => "<th>" + (label[h] || h) + "</th>").join("") + "</tr>";
  tb.innerHTML = d.rows.map((r) => {
    const tp = r[2] === "TP";
    return '<tr data-name="' + r[3] + '">' + r.map((v, i) => {
      if (i === 2) { return '<td class="' + (tp ? "ok" : "no") + '">' + v + "</td>"; }
      if (i === 3) { return "<td>" + v + "</td>"; }
      const num = Number(v);
      return '<td class="num">' + (isNaN(num) ? v : (i === 0 || i === 4 || i === 5 ? num : num.toFixed(4))) + "</td>";
    }).join("") + "</tr>";
  }).join("");
  $("serTitle").textContent = "검출 " + d.n_rows + "건" +
    (d.n_rows > d.rows.length ? " (앞 " + d.rows.length + "건 표시)" : "") +
    (d.foot && d.foot.length ? " · " + d.foot.join(" · ") : "");
  tb.querySelectorAll("tr").forEach((tr) => {
    tr.onclick = () => showFrame(tr.dataset.name, true);
  });
}

async function loadFrames(part) {
  const d = await api("/api/gt/eval/detail?run=" + encodeURIComponent(S.res.run) +
                      "&part=" + encodeURIComponent(part));
  const box = $("frames");
  if (d.error) { box.innerHTML = '<div class="legend">' + d.error + "</div>"; S.det = null; return; }
  S.det = d.images || {};
  // FP·FN 이 있는 프레임을 앞에 둔다(볼 이유가 있는 것부터)
  const names = Object.keys(S.det).sort((a, b) => score(b) - score(a));
  $("frTitle").textContent = names.length + "장 · 오차 있는 것부터";
  box.innerHTML = names.map((n) => card(n)).join("");        // GT 를 전부 보여 준다
  bindZoom();
  function score(n) {
    const v = S.det[n] || {};
    const rc = S.res.report_conf;
    const preds = (v.pred || []).filter((p) => p[4] >= rc);
    const tp = preds.filter((p) => p[6]).length;
    return (preds.length - tp) * 2 + Math.max(0, (v.gt || []).length - tp);
  }
}

function zoom(el, name) {
  const big = el.classList.toggle("big");
  const img = el.querySelector("img");
  img.src = "/api/gt/eval/frame?run=" + encodeURIComponent(S.res.run) +
            "&part=" + encodeURIComponent(S.part) + "&name=" + encodeURIComponent(name) +
            "&w=" + (big ? 1600 : 640);
  if (big) { el.scrollIntoView({ block: "nearest" }); }
}

function card(n) {
  const v = S.det[n] || {};
  const rc = S.res.report_conf;
  const preds = (v.pred || []).filter((p) => p[4] >= rc);
  const tp = preds.filter((p) => p[6]).length;
  const fp = preds.length - tp;
  const fn = Math.max(0, (v.gt || []).length - tp);
  return '<div class="fr" id="fr_' + n + '"><img loading="lazy" alt="' + n + " 프레임 GT " +
         (v.gt || []).length + " TP " + tp + " FP " + fp +
         '" src="/api/gt/eval/frame?run=' +
         encodeURIComponent(S.res.run) + "&part=" + encodeURIComponent(S.part) +
         "&name=" + encodeURIComponent(n) + '&w=640"><div class="cap"><span>' + n +
         "</span><span>GT " + (v.gt || []).length + " · TP " + tp + " · FP " + fp +
         " · FN " + fn + "</span></div></div>";
}

function bindZoom() {
  $("frames").querySelectorAll(".fr").forEach((el) => {
    el.onclick = () => zoom(el, el.id.slice(3));
  });
}

function showFrame(name, front) {
  if (!name || !S.det || !S.det[name]) { return; }
  const box = $("frames");
  const cur = Array.from(box.querySelectorAll(".fr")).map((e) => e.id.slice(3));
  if (front && cur[0] !== name) {
    const rest = cur.filter((x) => x !== name).slice(0, 11);
    box.innerHTML = [name].concat(rest).map((n) => card(n)).join("");
    bindZoom();
  }
  const el = $("fr_" + name);
  if (el) { el.scrollIntoView({ behavior: "smooth", block: "center" }); }
}

/* ---------------- 실행 ---------------- */
async function load(run) {
  const d = await api("/api/gt/eval/result" + (run ? "?run=" + encodeURIComponent(run) : ""));
  if (d.error) { say(d.error); steps(null); return; }
  say("");
  renderResult(d);
}

async function run() {
  $("btnRun").disabled = true;
  say("");
  const st = await api("/api/gt/status");
  const have = ((st.parts || []).filter((p) => p.labels > 0));
  if (!have.length) {
    say("GT 없음");
    $("btnRun").disabled = false; return;
  }
  steps(null, have.reduce((a, p) => a + p.labels, 0) + "장 준비");
  const r = await post("/api/gt/eval", { parts: have.map((p) => p.part), iou: 0.5 });
  if (r.error) { say(r.error); $("btnRun").disabled = false; return; }
  S.job = r.job;
  const tick = async () => {
    const s = await api("/api/sam2/status?job=" + S.job);
    if (s.error) { say(s.error); $("btnRun").disabled = false; return; }
    steps(null, (s.note || "") + (s.total ? " (" + s.done + "/" + s.total + ")" : ""));
    if (s.running) { setTimeout(tick, 1200); return; }
    $("btnRun").disabled = false;
    if (s.stage === "error") { say(s.error || "채점이 실패했습니다."); return; }
    await load();
  };
  tick();
}

$("btnRun").onclick = run;
$("runSel").onchange = (e) => load(e.target.value);
steps(null);
load();
</script>
</body>
</html>
