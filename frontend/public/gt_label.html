<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>GT 만들기 (시나리오1)</title>
<!--
  시험 시나리오1(mAP@0.5) 전용 GT 제작 화면. 일회용이다.

  2026-09-01 개편: 자동으로 10컷을 골라 주던 방식을 버렸다.
    버린 이유 - 모델이 shim 과 r-ring 을 같은 물체에 겹쳐 잡은 것도 그대로 뽑혔고,
    뽑힌 장면이 서로 비슷해 영상 다양성이 낮았다. 게다가 탐지 박스를 초깃값으로
    얹어 놓아 사람이 무엇을 고쳐야 하는지 판단할 근거가 없었다.
  바뀐 흐름
    1) 고르기 - 그 부품으로 탐지된 프레임을 전부 격자로 보여준다. 사람이 10장을 고른다.
       판단 근거로 모델이 잡은 박스를 얇게 겹쳐 보여준다. 참고용이고 GT 가 아니다.
    2) 라벨 - 고른 프레임만 순회한다. 처음에는 박스가 없다. 눌러서 SAM2 마스크로
       박스를 만들고, 끌어서 고치고, 저장하면 그것만 GT 가 된다.

  박스는 서버가 이미지에 그려 보내지 않는다. 좌표만 받아 화면이 SVG 로 그린다.
  외부 의존 없음(단일 파일). 색은 대시보드(app.css) 토큰을 그대로 옮겼다.
-->
<style>
  :root{
    --bg:#f1f5f9; --surface:#fff; --surface-2:#f8fafc; --surface-3:#f1f5f9;
    --line:#e2e8f0; --line-strong:#cbd5e1;
    --ink-strong:#0f172a; --ink:#1e293b; --muted:#64748b; --faint:#94a3b8;
    --accent:#4f46e5; --accent-ink:#4338ca; --accent-bg:#eef2ff; --accent-line:#c7d2fe;
    --success:#16a34a; --success-ink:#15803d; --success-line:#86efac; --success-bg:#dcfce7;
    --warn:#b45309; --warn-line:#fde68a; --warn-bg:#fffbeb;
    --danger:#dc2626; --danger-ink:#b91c1c; --danger-line:#fecaca; --danger-bg:#fee2e2;
    --r-sm:6px; --r-md:10px; --r-lg:14px;
    --font:'Noto Sans KR','Malgun Gothic',system-ui,-apple-system,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.5;
       display:flex;flex-direction:column}
  button{font:inherit;color:inherit;cursor:pointer}
  [hidden]{display:none !important}

  header{flex:none;background:var(--surface);border-bottom:1px solid var(--line);
         padding:10px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  h1{margin:0;font-size:17px;color:var(--ink-strong);white-space:nowrap}
  .sub{color:var(--muted);font-size:12px}
  .spacer{flex:1}

  .btn{min-height:36px;padding:0 14px;border-radius:var(--r-md);border:1px solid var(--line-strong);
       background:var(--surface);font-weight:600}
  .btn:hover:not(:disabled){border-color:var(--accent-line);background:var(--accent-bg)}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  .btn.primary:hover:not(:disabled){background:var(--accent-ink)}
  .btn.danger{background:var(--danger-bg);border-color:var(--danger-line);color:var(--danger-ink)}
  .btn.ghost{background:transparent;border-color:var(--line)}
  .btn:disabled{opacity:.45;cursor:not-allowed}

  select{min-height:36px;padding:0 10px;border-radius:var(--r-md);border:1px solid var(--line-strong);
         background:var(--surface);font:inherit;font-weight:600;min-width:180px}
  label.chk{display:inline-flex;align-items:center;gap:6px;color:var(--muted);font-size:12px;
            white-space:nowrap;cursor:pointer}

  .tabs{display:flex;border:1px solid var(--line-strong);border-radius:var(--r-md);overflow:hidden}
  .tabs button{min-height:36px;padding:0 16px;border:0;background:var(--surface);font-weight:700;
               color:var(--muted)}
  .tabs button.on{background:var(--accent);color:#fff}

  .pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;
        background:var(--surface-3);border:1px solid var(--line);font-size:12px;font-weight:700}
  .pill.ok{background:var(--success-bg);border-color:var(--success-line);color:var(--success-ink)}
  .pill.warn{background:var(--warn-bg);border-color:var(--warn-line);color:var(--warn)}
  .pill.bad{background:var(--danger-bg);border-color:var(--danger-line);color:var(--danger-ink)}

  main{flex:1;min-height:0;overflow:auto;padding:14px 16px 24px}
  .msg{margin:12px 0;padding:12px 14px;border-radius:var(--r-md);background:var(--warn-bg);
       border:1px solid var(--warn-line);color:var(--warn);font-weight:600}

  /* ---- 1. 고르기 ---- */
  .bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px}
  .hint{color:var(--muted);font-size:12px}
  /* 3열. 240px 자동채움으로 두니 한 줄에 5~6장이 들어가 부품이 안 보였다. */
  .grid{display:grid;gap:14px;grid-template-columns:repeat(3,1fr)}
  @media (max-width:1000px){.grid{grid-template-columns:repeat(2,1fr)}}
  @media (max-width:620px){.grid{grid-template-columns:1fr}}
  .card{position:relative;background:var(--surface);border:2px solid var(--line);
        border-radius:var(--r-md);overflow:hidden;cursor:pointer}
  .card:hover{border-color:var(--accent-line)}
  .card.on{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-bg)}
  .card .wrap{position:relative;background:#0f172a;aspect-ratio:16/9}
  .card img{width:100%;height:100%;object-fit:contain;display:block}
  .card .wrap svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
  .card .meta{padding:6px 8px;font-size:11px;color:var(--muted);display:flex;gap:6px;
              justify-content:space-between;align-items:center}
  .card .meta b{color:var(--ink);font-weight:700}
  .card .no{position:absolute;top:6px;left:6px;background:rgba(15,23,42,.78);color:#fff;
            border-radius:999px;padding:2px 8px;font-size:11px;font-weight:700}
  .card .tag{position:absolute;top:6px;right:6px;border-radius:999px;padding:2px 8px;
             font-size:11px;font-weight:700}
  .card .tag.sel{background:var(--accent);color:#fff}
  .card .tag.saved{background:var(--success);color:#fff}

  /* ---- 2. 라벨 ---- */
  .stage{position:relative;background:#0f172a;border-radius:var(--r-md);overflow:hidden;
         min-height:56vh;display:flex;align-items:center;justify-content:center}
  /* svg 를 .stage 에 깔면 이미지가 좌우로 레터박스될 때 좌표가 밀린다(실측 998px 이미지에
     1248px svg). 이미지 크기만큼만 차지하는 holder 안에 두어 둘을 정확히 겹친다. */
  .holder{position:relative;display:inline-block;line-height:0;max-width:100%}
  .holder img{display:block;max-width:100%;max-height:78vh}
  .holder svg{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:crosshair}
  .bx{fill:rgba(251,191,36,.10);stroke:#fbbf24;stroke-width:3;vector-effect:non-scaling-stroke}
  .bx.on{stroke:#4f46e5;fill:rgba(79,70,229,.20)}
  .hd{fill:#fff;stroke:#4f46e5;stroke-width:2;vector-effect:non-scaling-stroke;cursor:grab}
  .refbx{fill:none;stroke:#38bdf8;stroke-width:2;stroke-dasharray:6 4;vector-effect:non-scaling-stroke}
  .foot{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:10px}
  kbd{background:var(--surface-3);border:1px solid var(--line-strong);border-bottom-width:2px;
      border-radius:var(--r-sm);padding:1px 6px;font-size:11px;font-weight:700;color:var(--ink)}
</style>
</head>
<body>
<header>
  <h1>GT 만들기</h1>
  <div class="tabs">
    <button id="tabPick" class="on">1. 고르기</button>
    <button id="tabLab">2. 라벨</button>
  </div>
  <select id="partSel"></select>
  <span class="pill" id="cntFound">후보 -</span>
  <span class="pill" id="cntSel">선택 -</span>
  <span class="pill" id="cntSaved">GT -</span>
</header>

<main>
  <div class="msg" id="msg" hidden></div>

  <section id="viewPick">
    <div class="bar">
      <span class="spacer"></span>
      <button class="btn" id="btnClear">선택 비우기</button>
      <button class="btn primary" id="btnSaveSel">선택 저장</button>
    </div>
    <div class="grid" id="grid"></div>
  </section>

  <section id="viewLab" hidden>
    <div class="bar">
      <button class="btn" id="btnPrev">◀ 이전</button>
      <span class="pill" id="labPos">-</span>
      <button class="btn" id="btnNext">다음 ▶</button>
      <span class="pill" id="labInfo">-</span>
      <span class="spacer"></span>
      <button class="btn danger" id="btnDel">이 프레임 GT 삭제</button>
      <button class="btn primary" id="btnSave">GT 저장</button>
    </div>
    <div class="stage" id="stage">
      <div class="holder">
        <img id="im" alt="" />
        <svg id="svg" viewBox="0 0 1000 1000" preserveAspectRatio="none"></svg>
      </div>
    </div>
    <div class="foot">
      <span class="hint">
        빈 곳을 <b>한 번 누르면</b> 그 지점의 SAM2 마스크로 박스가 생깁니다 ·
        <b>끌면</b> 직접 그립니다 · 박스를 눌러 고르고 모서리를 끌어 크기 조절 ·
        <kbd>Del</kbd> 고른 박스 삭제 · <kbd>S</kbd> 저장 · <kbd>←</kbd><kbd>→</kbd> 이동
      </span>
    </div>
  </section>
</main>

<script>
"use strict";
const $ = (id) => document.getElementById(id);
const api = async (url, opt) => {
  const r = await fetch(url, opt);
  return r.json().catch(() => ({ error: "응답을 읽지 못했습니다(HTTP " + r.status + ")" }));
};
const post = (url, body) => api(url, {
  method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body)
});
function say(t, kind) {
  const m = $("msg");
  if (!t) { m.hidden = true; return; }
  m.hidden = false; m.textContent = t;
  m.style.background = kind === "ok" ? "var(--success-bg)" : "var(--warn-bg)";
  m.style.borderColor = kind === "ok" ? "var(--success-line)" : "var(--warn-line)";
  m.style.color = kind === "ok" ? "var(--success-ink)" : "var(--warn)";
}
const keyOf = (c) => c.stem + "|" + c.idx;
const frameUrl = (c, w) => "/api/gt/frame?stem=" + encodeURIComponent(c.stem) + "&idx=" + c.idx +
                           (w ? "&w=" + w : "");
const savedName = (c) => c.stem + "_" + String(c.idx).padStart(5, "0");
const clamp01 = (v) => Math.min(Math.max(v, 0), 1);

const S = {
  data: null, part: null, mode: "pick",
  sel: {},              // 부품 -> Set(key)
  list: [], i: 0,       // 라벨 대상(사람이 고른 프레임)
  boxes: [], act: -1,   // 정규화 [cx, cy, w, h]
  dirty: false
};

async function load(keepPart) {
  const d = await api("/api/gt/collect/result");
  if (d.error) { say(d.error); return; }
  S.data = d;
  S.sel = {};
  const parts = Object.keys(d.cands || {});
  parts.forEach((p) => { S.sel[p] = new Set((d.sel && d.sel[p]) || []); });
  const sel = $("partSel");
  sel.innerHTML = parts.map((p) => '<option value="' + p + '">' + p + "</option>").join("");
  S.part = (keepPart && parts.indexOf(keepPart) >= 0) ? keepPart : parts[0];
  sel.value = S.part;
  say("");
  render();
}

function counters() {
  const cands = (S.data.cands || {})[S.part] || [];
  const per = S.data.per_part || 10;
  const nsel = S.sel[S.part].size;
  const nsaved = ((S.data.saved || {})[S.part] || []).length;
  $("cntFound").textContent = "후보 " + cands.length + "장";
  const cs = $("cntSel");
  cs.textContent = "선택 " + nsel + "/" + per;
  cs.className = "pill " + (nsel === per ? "ok" : nsel > per ? "bad" : "warn");
  const cv = $("cntSaved");
  cv.textContent = "GT " + nsaved + "장";
  cv.className = "pill " + (nsaved >= per ? "ok" : "");
}

function render() {
  counters();
  if (S.mode === "pick") { renderPick(); } else { renderLab(); }
}

/* ---------------- 1. 고르기 ---------------- */
function renderPick() {
  $("viewPick").hidden = false; $("viewLab").hidden = true;
  $("tabPick").className = "on"; $("tabLab").className = "";
  const cands = (S.data.cands || {})[S.part] || [];
  const saved = new Set((S.data.saved || {})[S.part] || []);
  const g = $("grid");
  g.innerHTML = "";
  if (!cands.length) {
    g.innerHTML = '<div class="hint">이 부품으로 탐지된 프레임이 없습니다.</div>';
    return;
  }
  cands.forEach((c, n) => {
    const k = keyOf(c);
    const on = S.sel[S.part].has(k);
    const el = document.createElement("div");
    el.className = "card" + (on ? " on" : "");
    let ref = "";
    if (c.bbox && c.wh) {          // 모델이 잡은 박스는 항상 겹쳐 보여준다(참고용, GT 아님)
      const b = c.bbox, w = c.wh[0], h = c.wh[1];
      ref = '<svg viewBox="0 0 ' + w + " " + h + '" preserveAspectRatio="xMidYMid meet">' +
            '<rect class="refbx" x="' + b[0] + '" y="' + b[1] + '" width="' + (b[2] - b[0]) +
            '" height="' + (b[3] - b[1]) + '"/></svg>';
    }
    el.innerHTML =
      '<div class="wrap"><img loading="lazy" src="' + frameUrl(c, 800) + '" alt="">' + ref +
      '<span class="no">' + (n + 1) + "</span>" +
      (on ? '<span class="tag sel">선택</span>'
          : saved.has(savedName(c)) ? '<span class="tag saved">GT 있음</span>' : "") +
      '</div><div class="meta"><span>conf ' + c.conf.toFixed(2) + "</span></div>";
    el.onclick = () => {
      const s = S.sel[S.part];
      if (s.has(k)) { s.delete(k); } else { s.add(k); }
      renderPick(); counters();
    };
    g.appendChild(el);
  });
}

async function saveSel() {
  const r = await post("/api/gt/select",
                       { run: S.data.run, part: S.part, keys: Array.from(S.sel[S.part]) });
  if (r.error) { say(r.error); return; }
  say("선택 " + r.n + "장 저장했습니다. 상단 '2. 라벨' 로 넘어가세요.", "ok");
}

/* ---------------- 2. 라벨 ---------------- */
function selList() {
  const cands = (S.data.cands || {})[S.part] || [];
  const s = S.sel[S.part];
  return cands.filter((c) => s.has(keyOf(c)));
}

async function renderLab() {
  $("viewPick").hidden = true; $("viewLab").hidden = false;
  $("tabPick").className = ""; $("tabLab").className = "on";
  S.list = selList();
  if (!S.list.length) {
    $("labPos").textContent = "-"; $("labInfo").textContent = "-";
    $("im").removeAttribute("src"); $("svg").innerHTML = "";
    say("고른 프레임이 없습니다. '1. 고르기' 에서 먼저 선택하세요.");
    return;
  }
  say("");
  S.i = Math.min(Math.max(S.i, 0), S.list.length - 1);
  const c = S.list[S.i];
  $("labPos").textContent = (S.i + 1) + " / " + S.list.length;
  $("labInfo").textContent = c.stem + " · " + String(c.idx).padStart(5, "0") +
                             " · conf " + c.conf.toFixed(2);
  $("im").src = frameUrl(c, 0);
  const g = await api("/api/gt/label?part=" + encodeURIComponent(S.part) +
                      "&stem=" + encodeURIComponent(c.stem) + "&idx=" + c.idx);
  S.boxes = (g.boxes || []).map((b) => b.slice());
  S.act = S.boxes.length ? 0 : -1;
  S.dirty = false;
  drawBoxes();
}

function drawBoxes() {
  const V = 1000;
  let h = "";
  S.boxes.forEach((b, n) => {
    const x = (b[0] - b[2] / 2) * V, y = (b[1] - b[3] / 2) * V, w = b[2] * V, hh = b[3] * V;
    h += '<rect class="bx' + (n === S.act ? " on" : "") + '" data-i="' + n +
         '" x="' + x + '" y="' + y + '" width="' + w + '" height="' + hh + '"/>';
    if (n === S.act) {
      const pts = [[x, y, "nw"], [x + w / 2, y, "n"], [x + w, y, "ne"], [x + w, y + hh / 2, "e"],
                   [x + w, y + hh, "se"], [x + w / 2, y + hh, "s"], [x, y + hh, "sw"],
                   [x, y + hh / 2, "w"]];
      pts.forEach((p) => {
        h += '<rect class="hd" data-h="' + p[2] + '" x="' + (p[0] - 9) + '" y="' + (p[1] - 9) +
             '" width="18" height="18"/>';
      });
    }
  });
  $("svg").innerHTML = h;
  $("btnSave").textContent = S.dirty ? "GT 저장 *" : "GT 저장";
}

/* 화면 좌표 -> 0..1. viewBox 를 거쳐 계산하므로 레터박스 보정이 필요 없다 */
function toN(ev) {
  const svg = $("svg");
  const p = svg.createSVGPoint();
  p.x = ev.clientX; p.y = ev.clientY;
  const q = p.matrixTransform(svg.getScreenCTM().inverse());
  return [clamp01(q.x / 1000), clamp01(q.y / 1000)];
}

let drag = null;
$("svg").addEventListener("pointerdown", (ev) => {
  if (!S.list.length) { return; }
  ev.preventDefault();
  $("svg").setPointerCapture(ev.pointerId);
  const n = toN(ev);
  const t = ev.target;
  if (t && t.dataset && t.dataset.h) {
    drag = { kind: "handle", tag: t.dataset.h, moved: false };
    return;
  }
  if (t && t.dataset && t.dataset.i !== undefined) {
    S.act = Number(t.dataset.i);
    const b = S.boxes[S.act];
    drag = { kind: "move", ox: n[0] - b[0], oy: n[1] - b[1], moved: false };
    drawBoxes();
    return;
  }
  drag = { kind: "new", x0: n[0], y0: n[1], moved: false };
});
$("svg").addEventListener("pointermove", (ev) => {
  if (!drag) { return; }
  const n = toN(ev), nx = n[0], ny = n[1];
  drag.moved = true;
  if (drag.kind === "new") {
    const x = Math.min(drag.x0, nx), y = Math.min(drag.y0, ny);
    const w = Math.abs(nx - drag.x0), hh = Math.abs(ny - drag.y0);
    if (w < 0.004 && hh < 0.004) { return; }
    if (drag.made === undefined) {
      S.boxes.push([0, 0, 0, 0]); drag.made = S.boxes.length - 1; S.act = drag.made;
    }
    S.boxes[drag.made] = [x + w / 2, y + hh / 2, w, hh];
    S.dirty = true; drawBoxes(); return;
  }
  const b = S.boxes[S.act];
  if (!b) { return; }
  if (drag.kind === "move") {
    b[0] = clamp01(nx - drag.ox); b[1] = clamp01(ny - drag.oy);
  } else {
    let x1 = b[0] - b[2] / 2, y1 = b[1] - b[3] / 2, x2 = b[0] + b[2] / 2, y2 = b[1] + b[3] / 2;
    if (drag.tag.indexOf("n") >= 0) { y1 = ny; }
    if (drag.tag.indexOf("s") >= 0) { y2 = ny; }
    if (drag.tag.indexOf("w") >= 0) { x1 = nx; }
    if (drag.tag.indexOf("e") >= 0) { x2 = nx; }
    if (x2 < x1) { const t2 = x1; x1 = x2; x2 = t2; }
    if (y2 < y1) { const t2 = y1; y1 = y2; y2 = t2; }
    b[0] = (x1 + x2) / 2; b[1] = (y1 + y2) / 2;
    b[2] = Math.max(x2 - x1, 0.004); b[3] = Math.max(y2 - y1, 0.004);
  }
  S.dirty = true; drawBoxes();
});
$("svg").addEventListener("pointerup", async (ev) => {
  const d = drag; drag = null;
  if (d && d.kind === "new" && !d.moved) {   // 끌지 않고 한 번 누름 = SAM2 마스크 요청
    const n = toN(ev);
    await tap(n[0], n[1]);
  }
});

async function tap(nx, ny) {
  const c = S.list[S.i];
  if (!c) { return; }
  say("마스크 만드는 중…");
  const r = await post("/api/gt/tap", { stem: c.stem, idx: c.idx, points: [[nx, ny, 1]] });
  if (r.error) { say(r.error); return; }
  say("");
  if (r.combo) { $("im").src = "data:image/jpeg;base64," + r.combo; }
  if (r.box) { S.boxes.push(r.box.slice()); S.act = S.boxes.length - 1; S.dirty = true; drawBoxes(); }
  if (r.verdict === "over") { say("마스크가 화면 절반을 넘습니다. 부품 안쪽을 다시 눌러 보세요."); }
}

async function saveGT() {
  const c = S.list[S.i];
  if (!c) { return; }
  if (!S.boxes.length) { say("박스가 없습니다. 부품을 눌러 박스를 먼저 만드세요."); return; }
  const r = await post("/api/gt/commit",
                       { part: S.part, stem: c.stem, idx: c.idx, boxes: S.boxes });
  if (r.error) { say(r.error); return; }
  S.dirty = false;
  if (!S.data.saved) { S.data.saved = {}; }
  const sv = S.data.saved[S.part] || (S.data.saved[S.part] = []);
  if (sv.indexOf(savedName(c)) < 0) { sv.push(savedName(c)); }
  counters();
  say("저장했습니다 · " + S.part + " GT " + (r.labels != null ? r.labels : sv.length) + "장", "ok");
  if (S.i < S.list.length - 1) { S.i += 1; renderLab(); } else { drawBoxes(); }
}

async function delGT() {
  const c = S.list[S.i];
  if (!c) { return; }
  const r = await post("/api/gt/commit", { part: S.part, stem: c.stem, idx: c.idx, boxes: [] });
  if (r.error) { say(r.error); return; }
  S.data.saved[S.part] = ((S.data.saved || {})[S.part] || []).filter((x) => x !== savedName(c));
  S.boxes = []; S.act = -1; S.dirty = false;
  counters(); drawBoxes();
  say("이 프레임의 GT 를 지웠습니다.", "ok");
}

$("tabPick").onclick = () => { S.mode = "pick"; render(); };
$("tabLab").onclick = () => { S.mode = "label"; S.i = 0; render(); };
$("partSel").onchange = (e) => { S.part = e.target.value; S.i = 0; render(); };
$("btnClear").onclick = () => { S.sel[S.part].clear(); renderPick(); counters(); };
$("btnSaveSel").onclick = saveSel;
$("btnPrev").onclick = () => { if (S.i > 0) { S.i -= 1; renderLab(); } };
$("btnNext").onclick = () => { if (S.i < S.list.length - 1) { S.i += 1; renderLab(); } };
$("btnSave").onclick = saveGT;
$("btnDel").onclick = delGT;
document.addEventListener("keydown", (e) => {
  if (S.mode !== "label") { return; }
  if (e.key === "ArrowLeft" || e.key === "a") { $("btnPrev").click(); }
  else if (e.key === "ArrowRight" || e.key === "d") { $("btnNext").click(); }
  else if (e.key === "s" || e.key === "S") { saveGT(); }
  else if (e.key === "Delete" || e.key === "Backspace") {
    if (S.act >= 0) {
      S.boxes.splice(S.act, 1);
      S.act = S.boxes.length ? 0 : -1;
      S.dirty = true; drawBoxes();
    }
  }
});
load();
</script>
</body>
</html>
