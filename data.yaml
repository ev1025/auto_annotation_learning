# data.yaml - YOLO 학습 데이터 정의 파일
# - path 기준 상대경로로 train/val 이미지 폴더를 가리킨다.
# - 라벨(.txt)은 ultralytics 가 경로의 'images' -> 'labels' 치환으로 자동 탐색한다.
#   (예: datasets/images/train/a.jpg  ->  datasets/labels/train/a.txt)

path: ./datasets        # 데이터셋 루트(이 yaml 파일 위치 기준 상대경로)
train: images/train     # 학습 이미지 폴더
val: images/val         # 검증 이미지 폴더

# 클래스 이름: base_model 의 클래스와 '순서/개수'를 반드시 일치시켜야 한다.
# 아래는 예시이므로 실제 수리온 부품 클래스명으로 교체하세요.
#
# base_model 의 클래스를 확인하는 방법:
#   python -c "from ultralytics import YOLO; print(YOLO('models/base_model.pt').names)"
names:
  0: bolt
  1: bracket
  2: connector
  3: panel
