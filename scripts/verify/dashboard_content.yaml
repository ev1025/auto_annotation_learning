        gearbox(도메인갭 큼): 최고 0.557(yolo26n)에 그침. 라벨을 늘려도 0.181~0.562로 비단조·노이즈 → 병목은 라벨 '수'가 아니라 품질(타이트 마스크)·도메인갭
        배경합성 보정(축④): 위 (a)~(c)는 합성 미적용(raw)값. 같은 gearbox 학습셋에 실배경 copy-paste 500장을 더하니 최고 0.557→0.888(yolov8n)로 뛰어 a_test 수준 도달 = gearbox 병목은 학습량이 아니라 도메인갭이고 배경합성이 직접 해소함
        2클래스 함께: 전체 최고 0.644(yolo26n). 단독 대비 a_test 0.853→0.788·gearbox 0.557→0.501로 약 5~6%p만 하락 = 멀티클래스로 여러 부품을 한 모델에 담는 방식 타당
        한계(정직): 단일 난수 시드(1회)·GT 소량(a_test 30장, 부품 2종)·train 라벨이 SAM2 자동라벨 기반이라 라벨 품질이 성능 상한을 제약. 스윕 커브는 경향 파악용이지 정밀 수치 아님
