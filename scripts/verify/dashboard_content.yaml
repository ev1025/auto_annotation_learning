# 대시보드 콘텐츠 (코드와 분리). dashboard_core.py 가 읽어 렌더한다.
# 이 파일만 바꾸면 다른 프로젝트에도 재사용 가능(코드 수정 불필요).
# metrics.loader 값: autolearn | zeroshot | sweep | bench | followup | static
#   - 파일 기반: {loader: <name>, file: <결과 json 상대경로>}
#   - 고정 표:   {loader: static, headers: [...](선택), rows: [...], summary: "..."}
# experiments.<카테고리>.<주제>.loader 도 위 로더 이름을 그대로 씀.

paths:
  previews: dashboard/previews
  test_images: data/robo/yolo/test/images
  test_labels: data/robo/yolo/test/labels

gt_classes: [bearing, bolt, gear, nut]

# 클래스 이름 기준 고정 색(BGR). 예측·정답에서 같은 부품은 항상 같은 색.
class_colors:
  bearing: [0, 190, 0]     # 초록
  bolt: [0, 150, 255]      # 주황
  gear: [255, 130, 0]      # 파랑
  nut: [200, 0, 200]       # 자홍

# 기술 정의: 어떤 방법에서 쓰이든 '무슨 작업을 하는 모델인지'는 동일하게 기술.
tech_defs:
  "YOLO (yolo11s)": "실시간 객체 탐지 모델. 이미지에서 물체의 위치(박스)와 클래스를 예측한다"
  "self-training": "모델이 스스로 만든 예측을 2차 라벨로 삼아 다시 학습에 쓰는 준지도학습 기법"
  "Grounding DINO": "글(프롬프트)로 지정한 물체를 이미지에서 찾는 개방어휘 객체 탐지기. 텍스트·이미지 매칭이라 별도 학습이 필요 없다"
  "SAM": "이미지 속 물체를 픽셀 단위로 분할하는 모델. 물체 후보 영역(마스크)을 만든다"
  "CLIP": "이미지·텍스트를 같은 공간의 벡터로 바꾸는 임베딩 모델. 크롭 간 유사도 비교에 쓴다"
  "DINOv2": "이미지를 질감·형상 특징 벡터로 바꾸는 자기지도 임베딩 모델. 크롭 간 유사도 비교에 쓴다"

glossary:
  - ["1차 라벨", "포인트 참조(또는 초기 사람 라벨)로 처음 만든 라벨. 1차 모델 학습에 씀"]
  - ["무라벨", "라벨이 안 붙은 나머지 프레임·데이터. self-training이 예측해서 줍는 대상"]
  - ["2차 라벨", "1차 모델이 무라벨을 예측해 신뢰도 높은 것만 채택한 라벨 (self-training 결과)"]
  - ["1차 모델 / 2차 모델", "1차 라벨만 학습한 모델 / [1차+2차 라벨]을 합쳐 학습한 모델"]
  - ["라벨 / 바운딩박스", "이미지 속 부품 위치를 표시한 네모 상자. AI 학습의 '정답지'"]
  - ["정밀도", "만든 라벨 중 맞은 비율 (오답 라벨이 적을수록 높음)"]
  - ["재현율", "실제 부품 중 찾아낸 비율 (놓친 것이 적을수록 높음)"]
  - ["mAP50", "탐지 성능 종합 점수 (0~1, 높을수록 좋음)"]
  - ["conf (신뢰도)", "모델이 스스로 확신하는 정도. 0.6 이상만 라벨로 채택"]
  - ["평가셋", "학습에 쓰지 않고 채점에만 쓰는 별도 문제지"]

# 방법 1 콜아웃: 오토러닝을 조건(부품 수·1차 라벨 비율·TTA)별로 돌린 결과 요약표의 소스
autolearn_conditions:
  - ["2클래스·1차 라벨 10%", "results/exp_results/report_2cls_seed10.json"]
  - ["2클래스·1차 라벨 15%", "results/exp_results/report_2cls_seed15.json"]
  - ["2클래스·TTA 필터", "results/exp_results/report_2cls_tta.json"]
  - ["3클래스", "results/exp_results/report_3cls.json"]
  - ["4클래스", "results/exp_results/report_4cls.json"]

# 벤치마크 = 라벨링 방법이 아니라 '어떤 모델을 쓸지' 고른 사전 단계라 별도 뷰(맨 위)로 노출.
experiments:
  "모델 선정 (벤치마크)":
    "YOLO 버전 재벤치 (v8·11·26 × n·s·m) ⭐":
      loader: static
      desc: "부품 34클래스 실데이터로 YOLOv8·11·26 × n·s·m 8개 모델을 같은 조건(85:15 분할·imgsz640·100ep·서버 GPU2·3 병렬)에 학습·측정. mAP는 SAM2 자동라벨 기준이라 버전 간 상대비교용(천장권). 결과: results/bench/20260805_173149."
      headers: ["model", "mAP50", "mAP50-95", "P", "R", "params(M)", "size(MB)", "속도(ms)", "학습(min)"]
      rows:
        - ["yolo11s ⭐", "0.9931", "0.9737", "0.9865", "0.9881", "9.43", "19.2", "0.82", "30.7"]
        - ["yolov8m", "0.9898", "0.9750", "0.9834", "0.9932", "25.86", "52.1", "1.37", "41.9"]
        - ["yolov8n", "0.9896", "0.9694", "0.9846", "0.9855", "3.01", "6.2", "0.79", "24.9"]
        - ["yolo26s (기존 기본)", "0.9891", "0.9738", "0.9761", "0.9905", "9.48", "20.3", "0.90", "41.5"]
        - ["yolo11n", "0.9881", "0.9679", "0.9864", "0.9814", "2.59", "5.5", "0.75", "29.3"]
        - ["yolov8s", "0.9880", "0.9740", "0.9800", "0.9879", "11.14", "22.5", "0.76", "27.4"]
        - ["yolo26m", "0.9880", "0.9725", "0.9778", "0.9828", "20.38", "44.1", "1.44", "64.2"]
        - ["yolo26n", "0.9870", "0.9675", "0.9683", "0.9674", "2.38", "5.4", "0.92", "39.6"]
      subtables:
        - title: "추론 성능 (사진=단건 지연 ms · 실시간=연속 FPS, imgsz640)"
          headers: ["model", "PyTorch-GPU", "PyTorch-CPU", "ONNX-CPU", "ONNX-GPU"]
          rows:
            - ["yolov8n", "11.4ms / 87.7fps", "28.7ms / 36.4fps", "36.3ms / 27.7fps", "미측정"]
            - ["yolo11n", "11.5ms / 86.1fps", "31.4ms / 32.6fps", "41.0ms / 24.6fps", "미측정"]
            - ["yolo11s ⭐", "11.7ms / 83.8fps", "42.3ms / 23.8fps", "52.1ms / 20.1fps", "미측정"]
            - ["yolov8s", "11.4ms / 87.1fps", "43.6ms / 23.6fps", "51.1ms / 19.7fps", "미측정"]
            - ["yolo26n", "12.9ms / 79.1fps", "32.1ms / 31.5fps", "32.8ms / 30.6fps", "미측정"]
            - ["yolo26s (기존 기본)", "12.9ms / 77.3fps", "46.5ms / 21.7fps", "46.7ms / 21.4fps", "미측정"]
            - ["yolov8m", "12.2ms / 81.1fps", "72.4ms / 13.6fps", "78.1ms / 12.9fps", "미측정"]
            - ["yolo26m", "12.6ms / 79.5fps", "84.2ms / 12.4fps", "77.5ms / 13.3fps", "미측정"]
      summary: |-
        정확도(mAP50)는 8모델 모두 0.987~0.993으로 천장권(자동라벨 상대치) → 우열은 속도·크기로 결정
        yolo11s가 1위(0.9931)이자 기존 yolo26s 대비 전 항목 우위(mAP↑ · 크기 19.2<20.3MB · GPU 84>77fps · 학습 30.7<41.5분) → 학습 기본모델을 yolo11s로 교체
        경량·엣지 배포는 yolov8n(0.9896·6.2MB·CPU 36fps) 또는 yolo11n(0.9881·5.5MB) 권장
        ONNX-GPU는 onnxruntime-gpu 미설치로 미측정(공유 venv 오염 우려로 보류)
    "YOLO 14조합 비교":
      loader: bench
      file: "results/benchmark/benchmark.json"
      desc: "YOLO 계열 7종을 입력크기 640·1280 두 가지로 같은 데이터에 학습·측정해, 오토러닝에 쓸 모델과 크기를 고른 실험."
      summary: |-
        정확도(mAP50)는 상위권끼리 차이가 작아 속도·크기·안정성으로 결정
        yolo26s @ 640 채택 — 지연 최단, 같은 조건 시드(난수) 반복 시 분산 최소
        (※ 이후 부품 34클래스 재벤치에서 yolo11s가 전 항목 우위로 확인돼 기본모델을 yolo11s로 교체 — 위 "YOLO 버전 재벤치" 참조)
    "학습조건 재확인 (epoch·레시피·시드)":
      loader: followup
      file: "results/benchmark/exp_epochs.json"
      desc: "벤치마크 1위가 진짜인지, epoch 연장·다른 레시피·같은 조건 시드 반복으로 다시 확인한 실험."
      summary: |-
        300ep 연장은 효과 없고, yolo26n 레시피는 오히려 역효과
        같은 조건으로 시드(난수)만 3회 바꿔보니 v8s의 1위는 시드 운이었음
        단일 실행 순위는 신뢰할 수 없어 시드 반복이 필요하다는 결론 (뒤의 재현성 실험으로 이어짐)
  "도메인갭 극복 (밤샘 실험 · 실측 mAP)":
    "① 하이퍼파라미터 스윕 12구성":
      loader: static
      desc: "학습셋 498장 고정(train1·train2 SAM2 라벨). 한 번에 한 조건씩 바꿔 장착 도메인(test3·4)을 뚫는지 확인. 증강 '기본' = ultralytics 기본(mosaic·HSV·좌우반전·translate·scale0.5·erasing0.4)+degrees15. 배치는 메모리에 맞춰 03=6, 04·06=4, 나머지=8. mAP는 수동 GT 40장 실측."
      headers: ["실험", "모델", "입력", "epochs", "증강", "학습셋", "mAP50", "mAP50:95"]
      rows:
        - ["01 baseline", "YOLO26s", "640", "100", "기본", "498", "0.507", "0.396"]
        - ["02 가림+축소증강", "YOLO26s", "640", "100", "erasing0.6·scale0.9·degrees25·mixup0.15", "498", "실패", "-"]
        - ["03 입력 960", "YOLO26s", "960", "100", "기본", "498", "0.329", "0.158"]
        - ["04 입력 1280", "YOLO26s", "1280", "100", "기본", "498", "0.403", "0.262"]
        - ["05 모델 26n", "YOLO26n", "640", "100", "기본", "498", "0.539", "0.423"]
        - ["06 모델 26m", "YOLO26m", "640", "100", "기본", "498", "0.422", "0.329"]
        - ["07 모델 v8s", "YOLOv8s", "640", "100", "기본", "498", "0.548", "0.358"]
        - ["08 epochs 150", "YOLO26s", "640", "150", "기본", "498", "0.467", "0.351"]
        - ["09 mixup+erasing", "YOLO26s", "640", "100", "mixup0.2·erasing0.5", "498", "0.758", "0.510"]
        - ["10 train1만", "YOLO26s", "640", "100", "기본", "292", "0.491", "0.329"]
        - ["11 train2만", "YOLO26s", "640", "100", "기본", "206", "0.432", "0.273"]
        - ["12 dedup(10프레임당1장)", "YOLO26s", "640", "600", "기본", "51", "0.380", "0.245"]
      summary: "12구성 모두 장착 도메인(test3·4) 실패권. 모델·입력·epochs·부분집합으로는 mAP50:95 0.16~0.51에 그침. 원인은 학습 배경(작업대)≠실제(격납고) → copy-paste 합성으로 이어짐. 02는 degrees 이중전달 버그로 실패"
    "② copy-paste 증강 (누끼 → 실배경 합성)":
      loader: static
      desc: "기어박스 누끼(SAM2 마스크 컷아웃)를 격납고·공장 실배경에 합성(스케일·회전·위치 랜덤+금속판넬 누끼 부분가림). 공통 YOLO26s·640·100ep. Precision/Recall은 IoU0.5·conf0.25 기준. mAP는 수동 GT 40장 실측."
      headers: ["구성", "학습 데이터", "증강", "mAP50", "mAP50:95", "Precision", "Recall"]
      rows:
        - ["real_occ_aug", "실촬영 498", "erasing0.6·scale0.9·degrees25·mixup0.15", "0.676", "0.438", "0.35", "0.72"]
        - ["cp_synth_only", "합성 1494", "기본", "0.787", "0.437", "0.81", "0.72"]
        - ["cp_mix", "실촬영 498 + 합성 1494", "기본", "0.887", "0.741", "0.97", "0.78"]
        - ["cp_mix_aug", "실촬영 498 + 합성 1494", "erasing0.5·scale0.9·mixup0.15", "0.981", "0.502", "0.86", "0.95"]
      summary: "합성만·증강없는합성은 test4가 붕괴(Recall 낮음), 실촬영+합성(cp_mix)은 Precision 0.97로 박스 정밀도 1위(mAP50:95 0.741), +가림증강(cp_mix_aug)은 Recall 0.95로 탐지 1위(mAP50 0.981)나 박스 헐거움. 실배경 합성이 정밀도, 가림증강이 재현율 담당"
    "③ 수동 GT 실측 mAP (50 / 50:95)":
      loader: static
      desc: "test1~4에서 각 10장(내용 다양성 선별) 수동 라벨한 GT 40장으로 실제 mAP 측정. mAP50=탐지(IoU0.5), mAP50:95=박스 정밀도까지(IoU0.5~0.95 평균). Precision/Recall은 IoU0.5·conf0.25 기준. mAP50:95 순 정렬."
      headers: ["모델", "mAP50", "mAP50:95", "Precision", "Recall"]
      rows:
        - ["cp_mix (실촬영+합성)", "0.887", "0.741 ⭐", "0.97", "0.78"]
        - ["exp09 (증강만 mixup+erasing)", "0.758", "0.510", "0.28", "0.88"]
        - ["cp_mix_aug (실촬영+합성+가림증강)", "0.981 ⭐", "0.502", "0.86", "0.95"]
        - ["cp_synth_only (합성만)", "0.787", "0.437", "0.81", "0.72"]
        - ["real_occ_aug (실촬영+가림증강)", "0.676", "0.438", "0.35", "0.72"]
        - ["baseline (작업대만)", "0.507", "0.396", "0.88", "0.38"]
      summary: "검출률은 오탐을 못 걸러 exp09를 과대평가(Precision 0.28=오탐범벅)했음을 GT mAP가 교정. 탐지율 우선이면 cp_mix_aug(mAP50 0.98·Recall 0.95), 박스 정밀도 우선이면 cp_mix(mAP50:95 0.74·Precision 0.97)"
    "④ 재탭 타이트 라벨 재학습 (결과)":
      loader: static
      desc: "학습 라벨(SAM2 마스크→박스)이 수동 GT보다 헐거워 mAP50:95를 떨어뜨렸을 가능성 검증. 참조 프레임 21장을 다시 촘촘히 탭한 타이트 라벨 493장으로 누끼·합성 재생성 후 재학습. 공통 YOLO26s·640·100ep. Precision/Recall은 IoU0.5·conf0.25."
      headers: ["모델", "학습 라벨", "증강", "mAP50", "mAP50:95", "Precision", "Recall"]
      rows:
        - ["cp_mix_aug_retap ⭐", "재탭 493 + 합성", "erasing0.5·scale0.9·mixup0.15", "0.997", "0.688", "0.89", "1.00"]
        - ["cp_mix_aug (어제)", "옛 493 + 합성", "erasing0.5·scale0.9·mixup0.15", "0.981", "0.502", "0.86", "0.95"]
        - ["cp_mix_retap", "재탭 493 + 합성", "기본", "0.887", "0.431", "1.00", "0.75"]
        - ["cp_mix (어제)", "옛 493 + 합성", "기본", "0.887", "0.741", "0.97", "0.78"]
      summary: "타이트 라벨 효과 = 증강 모델에서 확실: cp_mix_aug의 mAP50:95 0.502→0.688(+0.19), Recall 0.95→1.00(GT 40장 전부 검출). 최종 후보 cp_mix_aug_retap = mAP50 0.997·Recall 100%·박스 정밀도↑, test1~4 전부 AP50 1.00. (증강없는 cp_mix_retap은 재탭 후 0.741→0.431 하락 = 단일시드 변동으로 판명, 아래 ⑤ 참조)"
    "⑤ 멀티시드 재현성 (cp_mix_aug_retap)":
      loader: static
      desc: "최종 후보 cp_mix_aug_retap을 같은 설정(재탭493+합성, 100ep)으로 시드만 0·1·2로 3회 학습해 mAP 분산 확인. 단일 실행이 시드 운인지 검증."
      headers: ["지표", "mean ± std", "min ~ max"]
      rows:
        - ["mAP50", "0.993 ± 0.004", "0.987 ~ 0.997"]
        - ["mAP50:95", "0.705 ± 0.081", "0.616 ~ 0.812"]
        - ["test3 AP50", "1.000 ± 0.000", "1.000"]
        - ["test4 AP50", "1.000 ± 0.000", "1.000"]
      summary: "탐지(mAP50)는 매우 안정적(±0.004)·test3·4 매 시드 AP50 1.00 = 배포 후보 신뢰 확정(시드 운 아님). 박스 정밀도(mAP50:95)는 ±0.08로 변동 큼(단일시드 비교 불가) — 단 최악 시드(0.616)도 어제 헐거운 라벨(0.502)보다 높아 타이트 라벨 개선은 견고. 앞서 cp_mix_retap 하락(0.431)도 이 변동 범위의 노이즈로 확인됨"

# ==================== 오토라벨링 방법 레지스트리 ====================
# badge: adopt(채택) / drop(탈락) / partial(부분 성공)
methods:
  - id: m1
    "no": 1
    title: "Pseudo-labeling"
    badge: adopt
    badge_label: "채택 (운영 루프)"
    subtitle: "의사 라벨링(Pseudo-labeling)은 라벨이 없는 데이터에 모델이 예측한 값을 2차 라벨로 지정해 학습에 재활용하는 준지도학습 기법입니다."
    bullets: []
    tech: [["YOLO (yolo26s)"], ["self-training"]]
    flow:
      - {step: "입력", text: "공개 기계부품 데이터 (bolt·nut·gear·bearing). 10~15%만 라벨을 남겨 1차 라벨로 쓰고 나머지는 라벨을 숨겨 무라벨로 둠"}
      - {step: "1차", text: "**1차 모델 학습** — 순수 YOLO(COCO 사전학습)에 1차 라벨 149장만 학습"}
      - {step: "2", text: "**2차 라벨 생성** — 1차 모델이 무라벨 647장을 예측, 신뢰도(confidence) 0.6 이상만 2차 라벨로 채택 (622장)"}
      - {step: "2차", text: "**2차 모델 학습** — 순수 YOLO 에 [1차 라벨 + 2차 라벨]을 합쳐 처음부터 재학습"}
      - {step: "검증", text: "**효과 검증** — 어느 학습에도 안 쓴 평가셋 199장에서 1차 vs 2차 성능 비교 → mAP50 0.8354 → 0.8586 상승 → **채택**"}
    gallery: null
    live: true
    code:
      - file: "scripts/labeling/pseudo_utils.py - predict_boxes()"
        note: "예측 + conf 필터. 1차 모델이 미라벨 이미지를 추론하고 신뢰도 0.6 이상만 통과시킴 (읽기 쉽게 풀어 쓴 것)"
        src: |
          results = model.predict(source=unlabeled_images, stream=True)
          for image, result in zip(unlabeled_images, results):
              accepted = [(cls, box) for cls, box, conf in result.boxes
                          if conf >= 0.6]           # 신뢰도 0.6 미만 예측은 버림
              yield image, accepted
      - file: "scripts/labeling/auto_labeling.py"
        note: "저장. predict_boxes 가 통과시킨 박스를 YOLO 라벨(.txt)로 기록"
        src: |
          for image, accepted in predict_boxes(model, unlabeled_images, conf=0.6):
              # 이미지와 같은 파일명 .txt 가 YOLO 의 짝 규칙
              save_label(labels_dir / f"{image.stem}.txt", accepted)
      - file: "scripts/training/train_pipeline.py"
        note: "재학습. 1차 모델 가중치가 아니라 순수 YOLO 에서 다시 시작"
        src: |
          model = YOLO("yolo26s.pt")            # 순수(COCO 사전학습) 가중치에서 시작
          model.train(data=1차_라벨 + 2차_라벨,     # 1차(사람) 라벨과 2차(자동) 라벨을 합쳐 학습
                      epochs=100)
          # 게이트: 새 모델 mAP50 가 기존보다 낮으면 배포하지 않고 폐기
    metrics: {loader: autolearn, file: "results/exp_results/report_2cls_seed15.json"}
    extras_table: autolearn_conditions

  - id: m2
    "no": 2
    title: "텍스트 제로샷 (Grounding DINO)"
    badge: drop
    badge_label: "탈락"
    subtitle: "학습되지 않은 객체를 설명 문구만으로 찾는 방법으로, 이미지의 객체와 프롬프트의 유사도를 판단하여 클래스를 부여하는 방식."
    bullets: []
    tech: [["Grounding DINO"]]
    flow:
      - {step: "입력", text: "이미지 1장 + 고정 영어 프롬프트 4개 (metal hex bolt screw → bolt 등, 매 이미지 동일)"}
      - {step: "1", text: "**영역·텍스트 인코딩** — 이미지에서 물체가 있을 법한 영역 후보를 뽑고, 프롬프트 4개를 각각 숫자 벡터로 변환"}
      - {step: "2", text: "**유사도 매칭** — 각 영역 후보와 프롬프트의 유사도를 계산해 0.35 이상만 남기고, 가장 닮은 프롬프트를 그 박스의 클래스로 결정"}
      - {step: "3", text: "**후처리** — 겹친 중복 박스(NMS)와 화면을 덮는 거대 박스 제거"}
      - {step: "출력", text: "**자동 라벨** — 탐지된 객체마다 박스 1개 + 클래스 1개 (프롬프트 4개는 '가능한 클래스 목록'일 뿐, 박스 수 = 이미지 속 통과한 객체 수. 볼트 5개면 bolt 박스 5개)"}
      - {step: "채점", text: "정답을 숨긴 평가셋 204장에 적용, 숨긴 정답과 IoU 0.5 대조 → 정밀도 0.238 / 재현율 0.415"}
      - {step: "탈락", text: "**탈락 사유** — 물체 위치는 곧잘 찾지만(재현율 0.42) hex bolt·hex nut 같은 유사 부품의 클래스를 자주 틀려, 오탐이 맞춘 것의 3배. 무검수 라벨 기준(정밀도 0.87)에 크게 미달."}
    gallery: "2_dino_text"
    live: false
    metrics: {loader: zeroshot, file: "results/exp_results/zeroshot/zeroshot_eval_post.json"}

  - id: m3
    "no": 3
    title: "Grounded-SAM 타이트박스"
    badge: drop
    badge_label: "탈락"
    subtitle: "방법 2의 틀린 라벨이 '박스가 헐렁해서'인지 검증한 방식. SAM 으로 박스를 물체 경계까지 좁혀도(위치 개선) 성능이 그대로라면, 문제는 위치가 아니라 클래스라는 뜻."
    bullets: []
    tech: [["Grounding DINO"], ["SAM", "여기선 생성된 박스를 물체 경계까지 좁히는 데 사용"]]
    flow:
      - {step: "입력", text: "이미지 + 영어 프롬프트 4개 (방법 2와 동일)"}
      - {step: "1", text: "**박스 생성** — Grounding DINO 로 프롬프트에 맞는 박스 생성 (방법 2와 동일). 박스가 물체보다 헐렁하게 나옴"}
      - {step: "2", text: "**타이트닝** — SAM 마스크로 각 박스의 네 변(좌표)을 물체의 픽셀 경계까지 좁힘. 위치·크기만 바뀌고 클래스는 그대로"}
      - {step: "채점", text: "평가셋 204장, 숨긴 정답과 IoU 0.5 대조 → 정밀도 0.239 (방법 2의 0.238과 사실상 동일)"}
      - {step: "탈락", text: "**탈락 사유 — 위치는 맞혔지만 '무슨 객체인지'를 못 맞힘.** 박스를 아무리 타이트하게 해도 성능이 안 오른다는 것은, 틀린 원인이 박스 여백(위치)이 아니라 클래스 오분류라는 뜻. (맞은 박스 IoU 는 DINO 원본 0.908 > SAM 0.876 로 오히려 과수축) → 다음은 클래스 판별력을 높이는 시각 매칭(방법 4·5)으로"}
    gallery: null
    live: false
    metrics: {loader: zeroshot, file: "results/exp_results/zeroshot/zeroshot_eval_gsam_tight.json"}

  - id: m4
    "no": 4
    title: "SAM + CLIP 갤러리"
